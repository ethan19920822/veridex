<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Veridex Alpha</title>
  <style>
    :root { color-scheme: dark; --bg:#0a0d12; --panel:#121821; --line:#263140; --text:#f0f4f8; --muted:#91a0b2; --accent:#9fd4ff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .wrap { max-width:1180px; margin:auto; padding:40px 24px 80px; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:34px; }
    .brand { font-size:30px; font-weight:750; letter-spacing:-.03em; }
    .sub { color:var(--muted); margin-top:6px; }
    button { background:var(--text); color:#0a0d12; border:0; border-radius:10px; padding:11px 16px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    .grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:12px; margin-bottom:28px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
    .metric { font-size:28px; font-weight:760; }
    .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin-top:4px; }
    .section-title { display:flex; justify-content:space-between; align-items:end; margin:28px 0 12px; }
    .section-title h2 { margin:0; font-size:18px; }
    .section-title span { color:var(--muted); font-size:13px; }
    .feed { display:flex; flex-direction:column; gap:10px; }
    .item { display:grid; grid-template-columns:105px 1fr 120px; gap:16px; align-items:start; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
    .reg { font-weight:800; }
    .title { font-weight:650; margin-bottom:5px; }
    .summary { color:var(--muted); font-size:14px; line-height:1.45; }
    .risk { justify-self:end; border:1px solid var(--line); border-radius:999px; padding:5px 9px; font-size:12px; text-transform:uppercase; }
    .risk.high,.risk.critical { border-color:#81434b; }
    .risk.medium { border-color:#7a6736; }
    .empty { color:var(--muted); padding:22px 2px; }
    .status { color:var(--muted); font-size:13px; margin-top:10px; text-align:right; }
    a { color:var(--accent); text-decoration:none; }
    @media (max-width:800px) { .grid{grid-template-columns:repeat(2,1fr)} .item{grid-template-columns:1fr}.risk{justify-self:start}.top{flex-direction:column} }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="brand">VERIDEX <span style="color:#708198;font-weight:500">alpha</span></div>
      <div class="sub">Global Regulatory Intelligence · Detect → Understand → Match → Act → Prove</div>
    </div>
    <div>
      <button id="run">Run monitor now</button>
      <div class="status" id="status">Australia coverage: AUSTRAC · APRA · ASIC</div>
    </div>
  </div>

  <div class="grid" id="metrics"></div>

  <div class="section-title">
    <h2>Regulatory changes</h2>
    <span>Official-source traceability first. Human review required.</span>
  </div>
  <div class="feed" id="feed"><div class="empty">Loading…</div></div>
</div>
<script>
  const metrics = document.getElementById('metrics');
  const feed = document.getElementById('feed');
  const run = document.getElementById('run');
  const status = document.getElementById('status');

  async function refresh(){
    const [s,c] = await Promise.all([fetch('/api/stats').then(r=>r.json()), fetch('/api/changes?limit=40').then(r=>r.json())]);
    metrics.innerHTML = [
      ['Sources',s.sources],['Documents',s.documents],['Changes',s.changes],['High risk',s.high_risk],['Profiles',s.profiles]
    ].map(([k,v])=>`<div class="card"><div class="metric">${v}</div><div class="label">${k}</div></div>`).join('');
    if(!c.length){
      feed.innerHTML = '<div class="empty">No baseline yet. Click “Run monitor now” on a machine with internet access.</div>';
      return;
    }
    feed.innerHTML = c.map(x=>`<div class="item">
      <div class="reg">${x.regulator}<div class="label">${x.jurisdiction}</div></div>
      <div><div class="title"><a href="${x.url}" target="_blank" rel="noreferrer">${escapeHtml(x.title)}</a></div><div class="summary">${escapeHtml(x.summary || 'Awaiting analysis')}</div></div>
      <div class="risk ${x.risk_level}">${x.risk_level}</div>
    </div>`).join('');
  }
  function escapeHtml(s){ return String(s).replace(/[&<>'"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
  run.onclick = async ()=>{
    run.disabled = true; status.textContent='Monitoring official sources…';
    try {
      const r = await fetch('/api/run',{method:'POST'});
      const data = await r.json();
      status.textContent = `Run complete · ${data.new} new · ${data.updated} updated · ${data.errors.length} errors`;
      await refresh();
    } catch(e){ status.textContent='Run failed: '+e; }
    finally { run.disabled=false; }
  };
  refresh();
</script>
</body>
</html>
