[project]
name = "veridex-alpha"
version = "0.1.0"
description = "Global regulatory intelligence alpha: detect, understand, match, act, prove."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "pypdf>=5,<6",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
veridex = "veridex.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["veridex*"]

[tool.pytest.ini_options]
pythonpath = ["."]
